data:
  tickers: [AAPL, MSFT, AMZN, GOOG] # traded
  benchmark: SPY # market benchmark, bought and held, not traded
  start: "2000-01-01"
  end: "2026-09-25" # included, a Friday
  data_dir: data

extra: # macro series, used only to describe the market regimes, never as a signal (06_download_extra_data.py)
  macro: [VIXCLS, T10Y3M, USREC, DFF, BAA10Y, CPIAUCSL, DTB3] # FRED series, same start and end as data

bloomberg: # semiconductor universe of the SOX index (09_download_bloomberg.py); files in data/bloomberg/, not on GitHub
  dir: data/bloomberg
  exited_after: 7 # days without prices before data.end after which a company counts as delisted (exit at its last price)
  features: # weeks of the descriptive features (src/features.py), computed with the prices up to each Friday
    short_return: 4
    momentum: [52, 4] # return from 52 to 4 weeks ago (the last month is left out)
    volatility: 26
    volatility_ratio: [10, 52] # recent against long volatility, the idea of the volatility indicator of the strategy
    trend: 26 # close against its moving average
    high: 52 # distance from the highest close
    beta: 52 # against the equal weight of the universe
    liquidity: 4 # average daily traded value
  winsorize: 0.01 # cut each feature at its 1% and 99% cross-sectional quantiles before the z-score

longshort: # final strategy: long/short on the SOX members (src/longshort.py, 12_optimize_longshort.py); periods and GA as ga
  features: [return_4w, momentum_52_4, trend_26w, from_high_52w, volatility_26w, volatility_ratio, beta_52w]
  quantile: 0.2 # long the top 20% of the scores, short the bottom 20%
  min_companies: 10 # no position in a week with fewer companies in the universe
  sizing: dollar # dollar: half long, half short; beta: sides sized so that the 52-week beta of the portfolio is zero
  borrow_bps_year: 50 # fee for borrowing the shares sold short, per year, on the short side
  random_search_seed: 0

strategies:
  sma: { window: 10 } # weeks
  random: { seed: 42 }
  ga: { params_file: data/ga/best.yaml } # members and vote chosen by 03_optimize_ga.py

ga: # genetic algorithm that chooses the parameters of the ensemble (src/ensemble.py, src/genetic.py)
  train_end: "2014-12-26" # last Friday of the training period; validation from here to metrics.is_end
  bounds: # weeks, [min, max] of the window of each indicator
    trend: [4, 52]
    momentum: [4, 52]
    reversal: [1, 8]
    volatility: [4, 26]
  scale_window: 26 # weeks of returns used to scale the indicators into z-scores
  warmup: 52 # weeks of returns before the first signal: the longest window, the same for every genome
  population: 60
  generations: 30
  crossover: 0.7 # probability that two parents are crossed
  mutation: 0.3 # probability that a genome is mutated
  tournament: 3 # genomes compared in each tournament of the selection
  seeds: [1, 2, 3, 4, 5] # one run per seed, its best genome is a member of the vote
  vote: 3 # long when at least this many members are long (majority of 5)
  random_search_seed: 0

metrics:
  type: open_to_open # execution at the next open, or close_to_close: at the close (see docs/metrics.md)
  risk_free: 0.02 # annual, about the average 3-month US T-bill rate over the period
  is_end: "2018-12-28" # last Friday of the In-Sample period
  cost_bps: 10 # cost of each trade, in basis points of the capital traded (strategies only)
